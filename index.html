<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM Ledger — H Squared Solution</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app-shell">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-text">
        <span class="brand-eyebrow">H Squared Solution</span>
        <span class="brand-name">CRM Ledger</span>
      </div>
    </div>
    <div class="sidebar-label">Businesses</div>
    <nav id="businessList" class="business-list"></nav>

    <div class="sidebar-footer">
      &copy; 2026 H Squared Solution. All rights reserved.
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-title">
        <span class="page-eyebrow">Active business</span>
        <h1 id="businessTitle">&mdash;</h1>
      </div>
      <div class="header-actions">
        <span id="statusMsg" class="status-msg"></span>
        <button id="refreshBtn" class="refresh-btn">Refresh</button>
      </div>
    </header>

    <main class="content">
      <section class="sheet-section">
        <div class="section-head">
          <h2>Leads</h2>
          <span class="section-rule"></span>
        </div>
        <div id="leadsGrid" class="entry-grid"></div>
      </section>

      <section class="sheet-section">
        <div class="section-head">
          <h2>Bids</h2>
          <span class="section-rule"></span>
        </div>
        <div id="bidsGrid" class="entry-grid"></div>
      </section>
    </main>
  </div>

</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>

</html>
